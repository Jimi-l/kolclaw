version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: media_annotation_workbench_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: media_annotation_workbench
      POSTGRES_USER: media_workbench
      POSTGRES_PASSWORD: media_workbench
    ports:
      - "5432:5432"
    volumes:
      - media_annotation_workbench_pgdata:/var/lib/postgresql/data

volumes:
  media_annotation_workbench_pgdata:

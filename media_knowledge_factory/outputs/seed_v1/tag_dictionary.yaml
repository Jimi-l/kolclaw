schema_version: "v1"
core_objects:
  ConversationMessage:
    description: "标准化后的单条沟通消息。"
    fields:
      platform: "平台类型，当前 V1 固定为 wechat。"
      channel_type: "沟通渠道，当前 V1 固定为 private_chat。"
      creator_id: "达人稳定主键。"
      creator_aliases: "达人代号、微信名、历史别名集合。"
      media_id: "媒介稳定主键。"
      role: "agency 或 creator。"
      raw_text: "原始文本。"
      clean_text: "脱敏 + 归一化文本。"
      timestamp: "原始时间戳。"
      source_refs: "指向源消息的可追溯引用。"
      evidence_span: "该条记录在源消息中的证据范围。"
  BriefCard:
    description: "从对话中抽出的合作需求卡。"
    fields:
      brand: "品牌或项目名。"
      product: "产品或推广对象。"
      platform: "涉及的平台集合。"
      deliverable_type: "交付类型，如 60s+ 视频。"
      content_direction: "内容方向或剧情要求。"
      schedule_window: "档期要求。"
      rights_requirements: "授权、二创、投流、不更新等权益要求。"
      distribution_requirements: "分发平台与免费/付费要求。"
      must_confirm_items: "必须确认项清单。"
      negotiable_items: "可谈项或替代项。"
  NegotiationEpisode:
    description: "围绕一个业务目标切出的连续谈判片段。"
    fields:
      workflow_stage: "全链路阶段标签。"
      episode_goal: "该片段的业务目标。"
      objection_type: "主要阻力类型。"
      agency_strategy: "媒介使用的谈判策略标签。"
      creator_response_type: "达人侧响应风格。"
      outcome: "推进结果。"
      evidence_message_ids: "支撑该 episode 的消息证据。"
  TalkTemplate:
    description: "参数化后的媒介话术模板。"
    fields:
      scenario_key: "workflow_stage.goal.objection 组合键。"
      template_text: "参数化模板正文。"
      slots: "模板中的参数槽位。"
      applicable_conditions: "适用条件列表。"
      risk_notes: "使用风险或边界说明。"
      source_episode_ids: "来源 episode 集合。"
  WorkflowPlaybookStep:
    description: "流程规则卡，用于 SOP 检索和人工复核。"
    fields:
      trigger_condition: "进入该步骤的触发条件。"
      required_inputs: "执行该步骤所需信息。"
      recommended_action: "推荐动作。"
      fallback_action: "失败后的回退动作。"
      exit_condition: "完成条件。"
  RetrievalChunk:
    description: "供中台 embedding / 检索使用的切片。"
    fields:
      chunk_type: "turn_chunk / episode_chunk / template_chunk / policy_chunk。"
      embedding_text: "实际用于 embedding 的拼接文本。"
      filter_tags: "用于过滤召回的标签集合。"
      source_refs: "指向源 episode / message / policy 的引用。"
      confidence: "当前切片的置信度。"
workflow_stages:
  cold_outreach: "首次冷启动触达达人，目标是拿到回复或建立联系。"
  contact_established: "已建立基础联系，如通过好友验证、确认沟通窗口。"
  brief_delivery: "媒介向达人发送合作背景、需求和待确认项。"
  quote_collection: "达人返回报价、返点、档期、权益、合作须知。"
  rights_negotiation: "围绕授权、分发、二创、置顶、保留时长等权益协商。"
  price_negotiation: "围绕刊例价、水下价、打包价、改价进行谈判。"
  rebate_negotiation: "围绕返点目标、返点补差、服务费压力进行谈判。"
  schedule_lock: "围绕档期、锁档、定金、发布时间风险进行推进。"
  cooperation_confirmation: "双方确认合作意向、合作成立或锁定合作。"
  supplier_onboarding: "收集入库、营业执照、收款、发票、账号等资料。"
  payment_push: "催款、请款、下单、尾款、定金等支付推进。"
  execution_followup: "拉执行群、推进制作、脚本、交付、发布准备。"
  revision_coordination: "围绕修改次数、重拍、脚本调整、额外要求沟通。"
  publication_confirmation: "确认发布动作、发布时间、平台挂载和上线结果。"
  data_feedback: "围绕播放、互动、保量、投放维护、数据回传沟通。"
  rebate_recovery: "围绕返点回收、返点打款、返点材料和打款凭证推进。"
  repeat_collaboration: "复购或再次合作的延展沟通。"
episode_goals:
  get_reply: "拿到达人回复或确认后续沟通入口。"
  collect_quote: "拿到完整报价、返点、权益和档期。"
  raise_rebate: "把返点提升到目标线附近。"
  cut_price: "争取降价或用权益换价。"
  secure_schedule: "确保达人能留档并满足发布时间。"
  confirm_rights: "确认分发、授权、二创、置顶、保留时长等权益。"
  collect_docs: "收集入库、开票、收款、主体证明等资料。"
  lock_execution: "确认合作、拉执行、推进制作与交付。"
  push_payment: "推动定金、尾款或正式下单完成。"
  confirm_publish: "确认内容已发布或具备发布条件。"
  collect_data: "催数据回传、维护数据或解释数据表现。"
  recover_rebate: "追回返点并拿到打款凭据。"
objection_types:
  price_too_high: "客户或媒介认为报价偏高，需要砍价。"
  rebate_below_target: "当前返点低于媒介目标，影响利润或服务费。"
  no_free_distribution: "免费分发平台不满足要求。"
  rights_limited: "授权、投流、保留期等权益受限。"
  schedule_risk: "档期、制作周期、留档方式导致发布时间风险。"
  payment_rule_rigid: "付款、请款、下单规则僵硬，阻塞合作推进。"
  document_missing: "营业执照、入库、开票或收款资料不全。"
  cannot_guarantee_metrics: "达人无法保量、保赞或解释数据。"
  no_secondary_creation: "达人不接受二创、二剪等再创作要求。"
  platform_rule_rigid: "平台或公司规则强约束，难以灵活变通。"
  none: "该 episode 不存在明显 objection。"
creator_traits:
  order_saturation:
    high: "达人不缺单或档期紧张，议价空间偏小。"
    medium: "达人有一定单量压力，但仍可沟通。"
    low: "达人相对缺单，通常更愿意换价或换权益。"
    unknown: "没有足够证据判断达人是否缺单。"
  flexibility_level:
    rigid: "规则边界强，几乎不愿改价或改权益。"
    negotiable: "可在局部条件上协商调整。"
    highly_flexible: "愿意大幅让利或快速给出替代方案。"
    unknown: "无法判断灵活度。"
  interaction_style:
    friendly: "语气亲和，愿意顺着媒介推进。"
    professional: "偏流程化、规范化、信息完整。"
    direct: "表达简短直接，少寒暄。"
    cautious: "多次确认细节，推进偏谨慎。"
    strong_boundary: "强边界，不轻易让步或反复强调规则。"
    unknown: "缺乏足够互动判断。"
  decision_speed:
    fast: "回复快、确认快、推进快。"
    normal: "常规响应速度。"
    slow: "明显存在等待、拖延或多轮确认。"
    unknown: "无法判断。"
commercial_state_fields:
  listed_price: "达人当前提供的公开或口头报价。"
  target_price: "媒介希望落到的成交价格或改价目标。"
  current_rebate_rate: "达人当前提供的返点比例。"
  target_rebate_rate: "媒介希望争取到的返点比例。"
  rebate_target_status: "当前返点是否达到目标线。"
  agency_margin_pressure: "媒介利润压力程度。"
  rights_gap_status: "权益是否已满足客户要求。"
  payment_blocker_type: "当前付款推进的主要阻塞类型。"
chunk_types:
  turn_chunk: "达人消息 + 媒介回复 + 最近 3 条上下文。"
  episode_chunk: "围绕一个业务目标的连续消息切片。"
  template_chunk: "参数化后的媒介话术模板切片。"
  policy_chunk: "SOP / 规则卡切片。"
sft_buckets:
  cold_outreach:
    - "cold_outreach"
    - "contact_established"
  brief_delivery:
    - "brief_delivery"
    - "quote_collection"
  negotiation:
    - "rights_negotiation"
    - "price_negotiation"
    - "rebate_negotiation"
    - "schedule_lock"
  execution:
    - "cooperation_confirmation"
    - "supplier_onboarding"
    - "payment_push"
    - "execution_followup"
    - "revision_coordination"
    - "publication_confirmation"
    - "data_feedback"
    - "repeat_collaboration"
  rebate_recovery:
    - "rebate_recovery"
knowledge_bases:
  brief_framework: "达人 brief 沟通框架知识库"
  negotiation_scene: "砍价 / 返点场景知识库"
  talk_library: "话术知识库"
  fulfillment_sop: "履约 SOP 知识库"
